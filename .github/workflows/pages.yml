name: Deploy GitHub Pages

on:
  push:
    branches: [master]
    paths: ['docs/**', 'README.md', 'README.zh.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy docs to gh-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
          # Jekyll renders the markdown; keep the branch free of action cruft.
          enable_jekyll: true
