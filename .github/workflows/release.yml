name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, release & publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

      - name: Pack tarball
        run: pnpm pack --pack-destination dist

      - name: Upload npm tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: harness-lark-npm-package
          path: dist/*.tgz
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  docker:
    name: Build & publish Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (plain image)
        id: meta-plain
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/deepseek-harness
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Extract metadata (lark image)
        id: meta-lark
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/deepseek-harness-lark
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build & push plain deepseek-harness
        uses: docker/build-push-action@v6
        with:
          context: .
          target: plain
          push: true
          tags: ${{ steps.meta-plain.outputs.tags }}
          labels: ${{ steps.meta-plain.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push deepseek-harness-lark
        uses: docker/build-push-action@v6
        with:
          context: .
          target: lark
          push: true
          tags: ${{ steps.meta-lark.outputs.tags }}
          labels: ${{ steps.meta-lark.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
