# The harness-lark bundle patch: the Lark/Feishu channel over a dsh profile.
#
# Applied as a patch layer over an existing profile composition (e.g. after
# dsh-base). The plugin requires Feishu app credentials; without them the
# gateway logs a startup error and the WebSocket stays disconnected.
#
# Example config:
#   appId: "cli_xxx"
#   appSecret: "secret"
#   brand: feishu            # feishu | lark
#   connectionMode: websocket
#   dmPolicy: open           # open | pairing | allowlist | disabled
#   groupPolicy: disabled    # open | allowlist | disabled
#   requireMentionInGroups: true
#
# Install with: dsh plugin --profile web add harness-lark

- insert:
    - id: lark
      name: 'harness-lark'
      config:
        appId: !!js process.env.FEISHU_APP_ID
        appSecret: !!js process.env.FEISHU_APP_SECRET
        brand: feishu
        connectionMode: websocket
        dmPolicy: open
        groupPolicy: disabled
        requireMentionInGroups: true
